<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Резюме - Лаба 3</title>
    <!-- Подключение внешнего CSS файла -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="resume-container">
        <header>
            <!-- Фото (заглушка, можно заменить на свою) -->
            <img src="https://via.placeholder.com/150" alt="Фото студента" class="photo">
            <h1 id="name">Иван</h1>
            <h2 id="surname">Иванов</h2>
        </header>

        <section class="info">
            <p>Студент группы ПИ-202</p>
            <p>Навыки: HTML, CSS, JavaScript</p>
        </section>

        <section class="controls">
            <h3>Редактирование</h3>
            <!-- Поле ввода для новой фамилии -->
            <input type="text" id="surnameInput" placeholder="Введите новую фамилию">
            <!-- Кнопка изменения фамилии -->
            <button id="changeSurnameBtn">Изменить фамилию</button>
            <!-- Кнопка изменения фона -->
            <button id="changeBgBtn">Случайный цвет фона</button>
        </section>
    </div>

    <!-- Подключение внешнего JS файла (defer гарантирует загрузку после HTML) -->
    <script src="script.js" defer></script>
</body>
</html>
